name: Build IPA

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.0'
        bundler-cache: true

    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod install --repo-update

    - name: Cache CocoaPods
      uses: actions/cache@v3
      with:
        path: Pods
        key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-

    - name: Install Dependencies
      run: pod install

    - name: Build Archive (Debug)
      if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == ''
      run: |
        xcodebuild archive \
          -workspace "ACROSS数采iOS.xcworkspace" \
          -scheme "ACROSSDataCollection" \
          -configuration Debug \
          -archivePath "build/ACROSSDataCollection.xcarchive" \
          -destination "generic/platform=iOS" \
          CODE_SIGNING_ALLOWED=NO

    - name: Build Archive (Release)
      if: github.event.inputs.build_type == 'release'
      run: |
        xcodebuild archive \
          -workspace "ACROSS数采iOS.xcworkspace" \
          -scheme "ACROSSDataCollection" \
          -configuration Release \
          -archivePath "build/ACROSSDataCollection.xcarchive" \
          -destination "generic/platform=iOS" \
          CODE_SIGNING_ALLOWED=NO

    - name: Create ExportOptions.plist
      run: |
        cat > build/ExportOptions.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>YOUR_TEAM_ID</string>
            <key>uploadSymbols</key>
            <false/>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
        </dict>
        </plist>
        EOF

    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath "build/ACROSSDataCollection.xcarchive" \
          -exportPath "build/output" \
          -exportOptionsPlist "build/ExportOptions.plist" \
          -allowProvisioningUpdates
      continue-on-error: true

    - name: Package Unsigned IPA (Fallback)
      if: failure()
      run: |
        # 如果签名失败，创建一个未签名的IPA用于测试
        cd build/ACROSSDataCollection.xcarchive/Products/Applications
        zip -r "../../../ACROSSDataCollection-unsigned.ipa" "ACROSS数采iOS.app"
        cd ../../..

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ACROSSDataCollection-IPA
        path: |
          build/output/*.ipa
          build/*.ipa
        if-no-files-found: ignore
        retention-days: 30

    - name: Upload Archive Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ACROSSDataCollection-Archive
        path: build/ACROSSDataCollection.xcarchive
        retention-days: 7
